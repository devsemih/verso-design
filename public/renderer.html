<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Tailwind CSS v4 Browser -->
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<!-- Iconify -->
<script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
<style>
  /* Minimal base styles — scoped to specific elements to avoid
     overriding Tailwind's @layer utilities (unlayered CSS always
     beats layered CSS in the cascade, so * selectors here would
     break Tailwind utility classes like p-4, m-2, etc.) */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    background: #FFFFFF;
    box-sizing: border-box;
  }
  #canvas {
    width: 100%;
    height: 100%;
    position: relative;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  #canvas::-webkit-scrollbar { display: none; }

  /* Hide all scrollbars globally — generated UIs should never show scrollbars */
  * { scrollbar-width: none; }
  *::-webkit-scrollbar { display: none; }

  #empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: #C7C7CC;
    font-size: 15px;
    gap: 8px;
  }
  #empty-state .icon { font-size: 48px; opacity: 0.3; }
  #empty-state .hint { font-size: 13px; opacity: 0.5; }

  body:not(.prototype-mode) [data-ps-id]:hover {
    outline: 2px solid rgba(59, 130, 246, 0.5);
    outline-offset: -1px;
  }

  [data-ps-link] {
    cursor: pointer;
  }

  /* Fix iconify-icon sizing: the web component renders SVG at 1em,
     so we must ensure font-size matches the intended display size.
     Tailwind's size-* utilities set width/height but not font-size. */
  iconify-icon {
    display: inline-flex !important;
    align-items: center;
    justify-content: center;
    vertical-align: middle;
  }
</style>
</head>
<body>
<div id="canvas">
  <div id="empty-state">
    <div class="icon">&#128241;</div>
    <div>Ready for design</div>
    <div class="hint">Ask your agent to design this screen</div>
  </div>
</div>
<script src="/renderer.js"></script>
</body>
</html>
